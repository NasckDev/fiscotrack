<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="FiscoTrack — calculadora educacional de resultados de renda variável com regras versionadas e explicáveis."
    />
    <title>FiscoTrack</title>
    <script>
      try {
        const saved = localStorage.getItem('fiscotrack-theme');
        const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (saved === 'dark' || (saved === null && prefersDark)) {
          document.documentElement.classList.add('dark');
        }
      } catch {
        /* armazenamento indisponível: segue o tema claro */
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
